[package]
name = "tauri-plugin-radium-engine"
version = "0.1.0"
description = "RadiumEngine accelerator: parallel tile prefetch, cache management and DEM sampling for offline maps"
edition = "2021"
license = "MIT"

[lib]
name = "tauri_plugin_radium_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
futures = "0.3"
png = "0.17"
walkdir = "2"
